services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: community
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/analytics-layers.sql:/docker-entrypoint-initdb.d/02-analytics-layers.sql:ro
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d community']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      PORT: 3000
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/community
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      LIVEKIT_URL: ${LIVEKIT_URL:-ws://localhost:7880}
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: secret
      EXPOSE_DEV_CODE: ${EXPOSE_DEV_CODE:-true}
      # Как часто пересобираются витрины Silver/Gold (0 — только вручную).
      ETL_INTERVAL_SEC: ${ETL_INTERVAL_SEC:-300}
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      livekit:
        condition: service_started

  # Dev-режим поднимает LiveKit с ключами devkey/secret без отдельного конфига.
  # Версия закреплена: с сервером старше 1.9 клиент livekit-client 2.x не может
  # опубликовать микрофон — публикация зависает без ошибки.
  livekit:
    image: livekit/livekit-server:v1.10
    command: --dev --bind 0.0.0.0
    ports:
      - '7880:7880'
      - '7881:7881'
      - '7882:7882/udp'

  coturn:
    image: coturn/coturn:latest
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    ports:
      - '3478:3478'
      - '3478:3478/udp'
      - '49160-49200:49160-49200/udp'

volumes:
  postgres_data:
